const TIENDA="https://payhip.com/CasoPendiente";
const STOP=new Set(["el","la","los","las","lo","un","una","unos","unas","de","del","con","en","a","al","y","o","por","se","su","sus","que","es","fue","era","don","dona","senor","senora","sr","sra","d","pts","ptas","pesetas","h","hora","horas","am","pm","exacta","exactamente"]);
const NIV={aprendiz:{n:'Aprendiz',pistas:3,sol:true,intentos:0,max:'bronce'},investigador:{n:'Investigador',pistas:1,sol:false,intentos:0,max:'plata'},comisario:{n:'Comisario',pistas:0,sol:false,intentos:3,max:'oro'}};
const ORDEN=['comisario','investigador','aprendiz'];
const enc=new TextEncoder(),dec=new TextDecoder();
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(w=>w&&!STOP.has(w)).join('')}
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function sha(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',enc.encode(s)))}
const hex=a=>[...a].map(x=>x.toString(16).padStart(2,'0')).join('');
async function des(keyStr,o){const k=await crypto.subtle.importKey('raw',await sha(keyStr),'AES-GCM',false,['decrypt']);return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(o.iv)},k,u8(o.ct)))}
const desofus=t=>decodeURIComponent(escape(atob(t.split('').reverse().join(''))));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const params=new URLSearchParams(location.search);
const NUM=params.get('caso')||Object.keys(DATA)[0];
const D=DATA[NUM];
const KEY='cp_sala_'+NUM+'_'+(D?D.salt:'');
let S;
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)S={nivel:null,paso:0,res:{},pistas:{},sols:{},fallos:{},pistasTot:0,solsTot:0,final:null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const app=document.getElementById('app');

function render(){
  const tag=document.getElementById('nivelTag');
  if(!D){app.innerHTML='<div class="card">No encuentro este caso. Revisa el enlace de tu expediente.</div>';return}
  if(!S.nivel){tag.style.display='none';return inicio()}
  tag.style.display='';tag.textContent='Nivel: '+NIV[S.nivel].n+(S.nivel!=='aprendiz'?' · bajar ▾':'');
  tag.onclick=bajar;
  if(S.final)return final();
  pasos();
}
function inicio(){
  app.innerHTML=`<h1>Expediente n.º ${D.numero}: ${esc(D.titulo)}</h1><p class="sub">${esc(D.subtitulo)}</p>
  <div class="card"><b>Bienvenido a la Sala de comprobación.</b> Aquí escribes tus respuestas. Cada acierto abre el paso siguiente, y el final solo se abre si resuelves los cinco. Tu progreso se guarda en este navegador.</div>
  <h1 style="font-size:24px">Elige tu nivel</h1>
  <div class="niveles">
   <button class="nivel" data-n="aprendiz"><h3>Aprendiz</h3><ul><li>3 pistas por paso</li><li>Puedes ver la solución (pasos 1–4)</li><li>Intentos sin límite</li></ul><span class="medal m-bronce">Medalla máx.: bronce</span></button>
   <button class="nivel" data-n="investigador"><h3>Investigador</h3><ul><li>1 pista por paso</li><li>Sin soluciones</li><li>Intentos sin límite</li></ul><span class="medal m-plata">Medalla máx.: plata</span></button>
   <button class="nivel" data-n="comisario"><h3>Comisario</h3><ul><li>Ninguna pista</li><li>Sin soluciones</li><li>3 intentos por paso; si fallas, bajas a Investigador</li></ul><span class="medal m-oro">Medalla: oro</span></button>
  </div><p class="peq">Puedes bajar de nivel cuando quieras, pero nunca subir.</p>`;
  app.querySelectorAll('.nivel').forEach(b=>b.onclick=()=>{S.nivel=b.dataset.n;save();render()});
}
function bajar(){
  const i=ORDEN.indexOf(S.nivel);if(i>=ORDEN.length-1)return;
  const sig=ORDEN[i+1];
  if(confirm('¿Bajar a '+NIV[sig].n+'? Tendrás más ayuda, pero tu medalla máxima será '+NIV[sig].max+'. No podrás volver a subir.')){S.nivel=sig;save();render()}
}
function pasos(){
  const n=D.pasos.length,p=D.pasos[S.paso];
  let tabs='<div class="tabs">'+D.pasos.map((x,i)=>`<span class="tab ${S.res[i]?'ok':i===S.paso?'act':'lock'}">${S.res[i]?'✓ ':''}${i+1}. ${esc(x.titulo)}</span>`).join('')+'</div>';
  const resueltos=D.pasos.map((x,i)=>S.res[i]?`<div class="resuelto">✓ Paso ${i+1} · ${esc(x.titulo)}: <span class="r">${esc([].concat(S.res[i]).join(' · '))}</span>${S.sols[i]?' <span class="peq">(con solución)</span>':''}</div>`:'').join('');
  const nv=NIV[S.nivel];
  const pis=(S.pistas[S.paso]||0);
  const ultimo=S.paso===n-1;
  const lim=nv.intentos;const fall=S.fallos[S.paso]||0;
  app.innerHTML=`<h1>${esc(D.titulo)}</h1>${tabs}
  <div class="card paso" id="paso"><div class="num">PASO ${S.paso+1} DE ${n}</div><h2>${esc(p.titulo)}</h2>
  <p class="preg">${esc(p.pregunta)}</p><div class="fmt">${esc(p.formato)}</div>
  ${p.campos.map((c,j)=>`<div class="campo">${c.etiqueta?'<label>'+esc(c.etiqueta)+'</label>':''}<input type="text" id="r${j}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`).join('')}
  <button class="btn prim" id="comp">Comprobar</button>
  ${lim?`<div class="intentos">Intentos: ${lim-fall} de ${lim}</div>`:''}
  <div class="msg" id="msg"></div>
  <div class="pistas">${p.pistas.slice(0,pis).map((t,i)=>`<div class="pista">Pista ${i+1}: ${esc(t)}</div>`).join('')}
   ${pis<nv.pistas?`<button class="btn sec" id="pista">Abrir pista ${pis+1} de ${nv.pistas}</button>`:''}
   ${nv.sol&&p.sol&&!ultimo?`<button class="btn sec" id="sol">Ver la solución</button>`:''}
   ${!nv.pistas?'<div class="peq">Nivel Comisario: aquí no hay pistas. Confía en tus pruebas.</div>':''}
   ${ultimo&&nv.sol?'<div class="peq">El último paso no tiene solución: el final tienes que descubrirlo tú.</div>':''}
  </div></div>${resueltos}`;
  const go=()=>comprobar();
  document.getElementById('comp').onclick=go;
  app.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
  const bp=document.getElementById('pista');if(bp)bp.onclick=()=>{S.pistas[S.paso]=pis+1;S.pistasTot++;save();render()};
  const bs=document.getElementById('sol');if(bs)bs.onclick=()=>{if(!confirm('¿Seguro? Ver la solución cuenta para tu medalla.'))return;mostrarSol()};
  setTimeout(()=>{const i=document.getElementById('r0');if(i)i.focus()},50);
}
async function probar(slotCampo,valor){
  const n=norm(valor);if(!n)return null;
  const h=hex(await sha('h|'+D.salt+'|'+slotCampo.slot+'|'+n));
  const e=slotCampo.e.find(x=>x.h===h);if(!e)return null;
  return await des('k|'+D.salt+'|'+slotCampo.slot+'|'+n,e);
}
async function comprobar(){
  const p=D.pasos[S.paso],msg=document.getElementById('msg');
  const vals=p.campos.map((c,j)=>document.getElementById('r'+j).value);
  if(vals.some(v=>!v.trim())){msg.className='msg mal';msg.textContent='Escribe tu respuesta.';return}
  const res=[];for(let j=0;j<p.campos.length;j++)res.push(await probar(p.campos[j],vals[j]));
  if(res.every(Boolean)){S.res[S.paso]=res.length>1?res:res[0];await avanzar();return}
  // fallo
  const card=document.getElementById('paso');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
  msg.className='msg mal';
  msg.textContent=p.campos.length>1?'Algo no encaja. Revisa tus pruebas.':['Esa no es. Vuelve a las pruebas.','Frío, frío… revisa los papeles.','No. ¿Seguro que no se te escapa una contradicción?'][Math.floor(Math.random()*3)];
  const lim=NIV[S.nivel].intentos;
  if(lim){S.fallos[S.paso]=(S.fallos[S.paso]||0)+1;save();
    if(S.fallos[S.paso]>=lim){alert('Has agotado tus 3 intentos. Pasas a nivel Investigador: tendrás 1 pista por paso.');S.nivel='investigador';save();render();return}
    render();const m=document.getElementById('msg');m.className='msg mal';m.textContent='Respuesta incorrecta.';}
}
function mostrarSol(){
  const p=D.pasos[S.paso];const t=desofus(p.sol);
  S.sols[S.paso]=1;S.solsTot++;save();
  const d=document.createElement('div');d.className='solu';d.innerHTML='<b>Solución:</b> '+esc(t)+'<br><span class="peq">Escribe la respuesta en la casilla para continuar.</span>';
  document.querySelector('.pistas').appendChild(d);document.getElementById('sol').remove();
}
async function avanzar(){
  if(S.paso<D.pasos.length-1){S.paso++;save();render();const m=document.getElementById('msg');if(m){m.className='msg bien';m.textContent='¡Correcto! Se abre el paso '+(S.paso+1)+'.'}window.scrollTo({top:0,behavior:'smooth'});return}
  const canons=[];D.pasos.forEach((x,i)=>canons.push(...[].concat(S.res[i])));
  try{const j=JSON.parse(await des('f|'+D.salt+'|'+canons.join('|'),D.final));S.final={medalla:medalla(),fecha:new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}),nivel:S.nivel};save();FINAL=j;render()}
  catch(e){alert('No se pudo abrir el final. Recarga la página e inténtalo de nuevo.')}
}
function medalla(){if(S.nivel==='comisario')return'oro';if(S.nivel==='investigador')return S.pistasTot<=2?'plata':'bronce';return'bronce'}
let FINAL=null;
async function final(){
  if(!FINAL){const canons=[];D.pasos.forEach((x,i)=>canons.push(...[].concat(S.res[i])));try{FINAL=JSON.parse(await des('f|'+D.salt+'|'+canons.join('|'),D.final))}catch(e){S.final=null;save();return render()}}
  const r=FINAL.rev,m=S.final.medalla;
  app.innerHTML=`<div style="text-align:center;margin:26px 0 6px"><span class="sello stampIn">${esc(r.titulo)}</span></div>
  <h1 style="text-align:center">${esc(D.titulo)}</h1>
  <div class="card final">${r.texto.map((t,i)=>`<p class="${i===r.texto.length-1?'ult':''}">${esc(t)}</p>`).join('')}</div>
  <div class="card"><h2 style="font-family:Fredoka;margin:0 0 8px">Tu diploma</h2>
   <div class="premio"><span class="medal m-${m}" style="font-size:18px">Medalla de ${m}</span><span class="peq">Nivel ${NIV[S.final.nivel].n} · ${S.pistasTot} pistas · ${S.solsTot} soluciones</span></div>
   <div class="campo"><label>Tu nombre (como quieres que salga en el diploma)</label><input type="text" id="nombre" maxlength="32" placeholder="Detective…"></div>
   <button class="btn prim" id="dip">Descargar mi diploma</button></div>
  <div class="card lamina"><h2 style="font-family:Fredoka;margin:0 0 8px">Lámina secreta desbloqueada</h2>
   <img src="data:image/jpeg;base64,${FINAL.lamina}" alt="Lámina del caso"><a class="btn prim" style="display:inline-block;text-decoration:none" download="ArchivoVillanieblas_Lamina_Caso${D.numero}.jpg" href="data:image/jpeg;base64,${FINAL.lamina}">Descargar la lámina</a></div>
  <div class="card"><b>¿Lo has resuelto?</b> Dilo en los comentarios del vídeo con tu medalla… <i>sin destripar al culpable</i>. Y si quieres otro caso, el archivo sigue lleno: <a href="${TIENDA}" target="_blank" rel="noopener" style="color:var(--sello);font-weight:600">ver más casos</a>.</div>`;
  document.getElementById('dip').onclick=diploma;
}
async function diploma(){
  const nombre=(document.getElementById('nombre').value||'Detective anónimo').trim().slice(0,32);
  await Promise.all(["700 10px Fredoka","400 10px 'Special Elite'","700 10px Caveat","400 10px Inter"].map(f=>document.fonts.load(f)));
  const W=1600,H=1130,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const m=S.final.medalla,col={oro:'#E8B53A',plata:'#C9CED6',bronce:'#C27B45'}[m];
  x.fillStyle='#F3E5C4';x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W/2,H/2,100,W/2,H/2,900);g.addColorStop(0,'#fff5');g.addColorStop(1,'#b8955a33');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#241726';x.lineWidth=14;x.strokeRect(40,40,W-80,H-80);x.lineWidth=3;x.strokeRect(64,64,W-128,H-128);
  x.textAlign='center';x.fillStyle='#241726';
  x.font="400 34px 'Special Elite'";x.fillText('A R C H I V O   V I L L A N I E B L A S  ·  1 9 5 8',W/2,150);
  x.font='700 92px Fredoka';x.fillText('DIPLOMA DE DETECTIVE',W/2,270);
  x.font='400 32px Inter';x.fillText('Se certifica que',W/2,350);
  x.font='700 118px Caveat';x.fillStyle='#C2372B';x.fillText(nombre,W/2,480);
  x.fillStyle='#241726';x.font='400 32px Inter';
  x.fillText('ha cerrado el Expediente n.º '+D.numero+':',W/2,560);
  x.font='700 48px Fredoka';x.fillText('«'+D.titulo+'»',W/2,625);
  x.font="400 30px 'Special Elite'";x.fillText('Nivel '+NIV[S.final.nivel].n+'  ·  '+S.final.fecha,W/2,690);
  // medalla
  const mx=330,my=860;x.beginPath();x.moveTo(mx-60,my-170);x.lineTo(mx-20,my-40);x.lineTo(mx+20,my-40);x.lineTo(mx+60,my-170);x.closePath();x.fillStyle='#C2372B';x.fill();
  x.beginPath();x.arc(mx,my,105,0,7);x.fillStyle=col;x.fill();x.lineWidth=10;x.strokeStyle='#241726';x.stroke();
  x.beginPath();x.arc(mx,my,80,0,7);x.lineWidth=4;x.stroke();
  x.fillStyle='#241726';x.font='700 40px Fredoka';x.fillText(m.toUpperCase(),mx,my+14);
  // sello
  x.save();x.translate(W-370,850);x.rotate(-0.12);x.strokeStyle='#C2372B';x.lineWidth=10;x.strokeRect(-230,-70,460,140);x.lineWidth=3;x.strokeRect(-215,-55,430,110);
  x.fillStyle='#C2372B';x.font="400 62px 'Special Elite'";x.fillText('CASO CERRADO',0,22);x.restore();
  x.fillStyle='#241726';x.font='700 50px Caveat';x.fillText('El Archivero',W/2,920);x.fillRect(W/2-170,940,340,3);
  x.font='400 24px Inter';x.fillText('Firma',W/2,975);
  const a=document.createElement('a');a.download='Diploma_ArchivoVillanieblas_Caso'+D.numero+'.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();
}
load();render();
